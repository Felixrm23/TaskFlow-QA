name: TaskFlow IA Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # O la versión que prefieras usar en CI

      - name: Instalar dependencias
        run: npm install

      - name: Levantar servidor en segundo plano de forma limpia
        run: |
          nohup npm run dev > server.log 2>&1 &
          npx wait-on http://127.0.0.1:3000

      - name: Ejecutar pruebas nativas
        run: npm run test